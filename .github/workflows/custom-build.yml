name: Custom APK (upstream + patches)

# 毎日、steeben/Dial の最新リリースを確認する。
# 新しいリリースがあれば custom/patches/ のパッチを当てて APK をビルドし、
# このリポジトリの Releases に「<タグ>-custom」として公開する。
# 手動で動かす時は Actions → このワークフロー → Run workflow。
on:
  schedule:
    - cron: '17 21 * * *'   # 毎日 06:17 JST
  workflow_dispatch:
    inputs:
      force:
        description: '同じバージョンでも作り直す'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: custom-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 最新の元アプリのバージョンを調べる
        id: ver
        run: |
          TAG=$(git ls-remote --tags --refs https://github.com/steeben/Dial.git \
                | awk -F/ '{print $3}' | grep -E '^v?[0-9]+(\.[0-9]+)*$' | sort -V | tail -n1)
          [ -n "$TAG" ] || { echo "::error::元アプリのタグが取れない"; exit 1; }
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "元アプリの最新: $TAG"
          if gh release view "$TAG-custom" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
             && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=1" >> "$GITHUB_OUTPUT"
            echo "$TAG-custom は作成済みなので何もしない。"
          fi

      - name: パッチを取り出す
        if: steps.ver.outputs.skip != '1'
        uses: actions/checkout@v5
        with:
          path: fork
          sparse-checkout: custom

      - name: 元アプリのソースを取得
        if: steps.ver.outputs.skip != '1'
        uses: actions/checkout@v5
        with:
          repository: steeben/Dial
          ref: ${{ steps.ver.outputs.tag }}
          path: app-src

      - name: パッチを当てる
        if: steps.ver.outputs.skip != '1'
        working-directory: app-src
        run: |
          git config user.name ci && git config user.email ci@localhost
          for p in ../fork/custom/patches/*.patch; do
            echo "適用: $p"
            git apply --3way "$p" || { echo "::error::$p が当たらない。元アプリ側の変更で、パッチの更新が必要。"; exit 1; }
          done
          git diff --stat

      - name: JDK 17
        if: steps.ver.outputs.skip != '1'
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - if: steps.ver.outputs.skip != '1'
        uses: gradle/actions/setup-gradle@v5

      - name: ビルド
        if: steps.ver.outputs.skip != '1'
        working-directory: app-src
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          chmod +x gradlew
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > "$RUNNER_TEMP/key.keystore"
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark \
              -Pandroid.injected.signing.store.file="$RUNNER_TEMP/key.keystore" \
              -Pandroid.injected.signing.store.password=android \
              -Pandroid.injected.signing.key.alias=androiddebugkey \
              -Pandroid.injected.signing.key.password=android
          else
            echo "::warning::DEBUG_KEYSTORE_BASE64 が未設定。毎回別の鍵になるので、更新のたびにアンインストールが必要。"
            ./gradlew assembleDevBenchmark -x lintVitalDevBenchmark
          fi

      - name: Releases に公開
        if: steps.ver.outputs.skip != '1'
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          APK=$(ls app-src/app/build/outputs/apk/dev/benchmark/*.apk | head -n1)
          cp "$APK" "Dial-$TAG-custom.apk"
          gh release delete "$TAG-custom" -R "$GITHUB_REPOSITORY" -y --cleanup-tag 2>/dev/null || true
          gh release create "$TAG-custom" "Dial-$TAG-custom.apk" -R "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --title "Dial $TAG (custom)" \
            --notes "元アプリ $TAG に custom/patches のパッチを適用したビルド。"
